<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时文本查看 - 课堂监听系统</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #2c3e50;
            margin: 0;
        }

        .back-btn {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-btn:hover {
            background-color: #2980b9;
        }

        .status-bar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .recording-indicator {
            width: 12px;
            height: 12px;
            background-color: #dc3545;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        .text-viewer {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            min-height: 500px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .text-viewer.no-recording {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7f8c8d;
            font-size: 18px;
        }

        .text-line {
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #3498db;
            background-color: #f8f9fa;
            border-radius: 3px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text-timestamp {
            color: #7f8c8d;
            font-size: 12px;
            margin-right: 10px;
            font-family: 'Courier New', monospace;
        }

        .text-content {
            color: #2c3e50;
            font-size: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-refresh {
            background-color: #2ecc71;
            color: white;
        }

        .btn-refresh:hover {
            background-color: #27ae60;
        }

        .btn-clear {
            background-color: #95a5a6;
            color: white;
        }

        .btn-clear:hover {
            background-color: #7f8c8d;
        }

        .btn-download {
            background-color: #3498db;
            color: white;
        }

        .btn-download:hover {
            background-color: #2980b9;
        }

        .auto-refresh-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .auto-refresh-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .stats {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }

        .error-message {
            background-color: #ffe5e5;
            border: 1px solid #ff6b6b;
            color: #c0392b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        /* 滚动条样式 */
        .text-viewer::-webkit-scrollbar {
            width: 8px;
        }

        .text-viewer::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .text-viewer::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .text-viewer::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>📄 实时文本查看</h1>
            <a href="/" class="back-btn">← 返回主页</a>
        </div>

        <div id="statusBar" class="status-bar" style="display: none;">
            <div class="status-info">
                <div class="status-item">
                    <div class="recording-indicator"></div>
                    <span><strong>正在记录</strong></span>
                </div>
                <div class="status-item">
                    <span>会话 ID: <strong id="sessionId">-</strong></span>
                </div>
                <div class="stats" id="stats">
                    <span>行数: <strong id="lineCount">0</strong></span>
                    <span>字符数: <strong id="charCount">0</strong></span>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="controls">
            <button class="btn btn-refresh" onclick="loadText()">🔄 刷新</button>
            <button class="btn btn-download" onclick="downloadText()" id="downloadBtn" disabled>💾 下载文本</button>
            <button class="btn btn-clear" onclick="clearViewer()">🗑️ 清空显示</button>
            <label class="auto-refresh-toggle">
                <input type="checkbox" id="autoRefresh" checked>
                <span>自动刷新 (每3秒)</span>
            </label>
        </div>

        <div id="textViewer" class="text-viewer no-recording">
            <div class="loading">正在加载...</div>
        </div>
    </div>

    <script>
        let currentSessionId = null;
        let autoRefreshInterval = null;
        let previousText = '';
        let isAutoScrollEnabled = true;

        // 加载文本内容
        async function loadText() {
            try {
                // 首先检查是否有正在记录的会话
                const statusResponse = await fetch('/api/stt/current');
                const statusData = await statusResponse.json();

                if (!statusData.recording) {
                    showNoRecording();
                    return;
                }

                currentSessionId = statusData.session_id;
                document.getElementById('sessionId').textContent = currentSessionId;
                document.getElementById('statusBar').style.display = 'flex';
                document.getElementById('downloadBtn').disabled = false;

                // 获取文本内容
                const textResponse = await fetch('/api/stt/current/text');
                if (textResponse.ok) {
                    const textContent = await textResponse.text();

                    // 只在内容变化时更新
                    if (textContent !== previousText) {
                        displayText(textContent);
                        previousText = textContent;
                        updateStats(textContent);
                    }

                    hideError();
                } else {
                    showError('无法加载文本内容');
                }

            } catch (error) {
                console.error('加载失败:', error);
                showError('加载失败: ' + error.message);
            }
        }

        // 显示文本内容
        function displayText(content) {
            const viewer = document.getElementById('textViewer');
            viewer.classList.remove('no-recording');

            if (!content || content.trim() === '') {
                viewer.innerHTML = '<div class="no-recording">暂无内容</div>';
                return;
            }

            // 检测用户是否在底部
            const wasAtBottom = viewer.scrollHeight - viewer.scrollTop <= viewer.clientHeight + 50;

            // 解析文本内容
            const lines = content.split('\n').filter(line => line.trim());
            const textLines = lines.filter(line => line.match(/^\[\d{2}:\d{2}:\d{2}\]/));

            if (textLines.length === 0) {
                viewer.innerHTML = '<div class="no-recording">暂无识别内容</div>';
                return;
            }

            // 生成HTML
            const html = textLines.map(line => {
                const match = line.match(/^\[(\d{2}:\d{2}:\d{2})\]\s+(.+)$/);
                if (match) {
                    const [, time, text] = match;
                    return `
                        <div class="text-line">
                            <span class="text-timestamp">[${time}]</span>
                            <span class="text-content">${escapeHtml(text)}</span>
                        </div>
                    `;
                }
                return '';
            }).join('');

            viewer.innerHTML = html;

            // 如果之前在底部，自动滚动到底部
            if (wasAtBottom && isAutoScrollEnabled) {
                viewer.scrollTop = viewer.scrollHeight;
            }
        }

        // 显示无记录状态
        function showNoRecording() {
            const viewer = document.getElementById('textViewer');
            viewer.classList.add('no-recording');
            viewer.innerHTML = `
                <div>
                    📭 当前没有正在进行的记录<br>
                    <small>启动监听后，识别的文本会实时显示在这里</small>
                </div>
            `;
            document.getElementById('statusBar').style.display = 'none';
            document.getElementById('downloadBtn').disabled = true;
            currentSessionId = null;
            previousText = '';
        }

        // 更新统计信息
        function updateStats(content) {
            const lines = content.split('\n').filter(line => line.match(/^\[\d{2}:\d{2}:\d{2}\]/));
            const chars = content.replace(/\[\d{2}:\d{2}:\d{2}\]\s*/g, '').replace(/\s+/g, '').length;

            document.getElementById('lineCount').textContent = lines.length;
            document.getElementById('charCount').textContent = chars;
        }

        // 清空显示
        function clearViewer() {
            const viewer = document.getElementById('textViewer');
            viewer.classList.add('no-recording');
            viewer.innerHTML = '<div>显示已清空，内容仍保存在文件中</div>';
            previousText = '';
        }

        // 下载文本
        async function downloadText() {
            if (!currentSessionId) return;

            try {
                const response = await fetch(`/api/stt/session/${currentSessionId}/export`);
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentSessionId}.txt`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    // 如果导出失败，直接下载当前文本
                    const textResponse = await fetch('/api/stt/current/text');
                    if (textResponse.ok) {
                        const text = await textResponse.text();
                        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `stt_${currentSessionId}.txt`;
                        document.body.appendChild(a);
                        a.click();
                        window.URL.revokeObjectURL(url);
                        document.body.removeChild(a);
                    }
                }
            } catch (error) {
                console.error('下载失败:', error);
                alert('下载失败: ' + error.message);
            }
        }

        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 隐藏错误
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 自动刷新切换
        document.getElementById('autoRefresh').addEventListener('change', function (e) {
            if (e.target.checked) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        });

        // 启动自动刷新
        function startAutoRefresh() {
            if (autoRefreshInterval) return;
            autoRefreshInterval = setInterval(loadText, 3000);
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }

        // 检测滚动位置
        document.addEventListener('DOMContentLoaded', function () {
            const viewer = document.getElementById('textViewer');
            viewer.addEventListener('scroll', function () {
                const isAtBottom = viewer.scrollHeight - viewer.scrollTop <= viewer.clientHeight + 50;
                isAutoScrollEnabled = isAtBottom;
            });
        });

        // 初始化
        loadText();
        startAutoRefresh();

        // 页面卸载时停止自动刷新
        window.addEventListener('beforeunload', stopAutoRefresh);
    </script>
</body>

</html>
